name: Build & Release Asus Zenfone Max Pro M1

permissions:
  contents: write
  actions: write

on:
  push:
  workflow_dispatch:

concurrency:
  group: x00td-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Build Kernel X00TD (4.19)"
    uses: ./.github/workflows/build-asus-zenfone-max-pro-m1-lineageos23-a16.yml
    secrets: inherit

  release-kernel:
    name: "Release Kernel X00TD"
    runs-on: ubuntu-latest
    needs: build-kernel
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Download Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Kernel-*
          path: ./artifacts
          merge-multiple: true

      - name: ✅ Verify Kernel Zip
        run: |
          ls -la artifacts
          test -n "$(find artifacts -maxdepth 1 -name '*.zip')"

      - name: 🚀 Create Release and Upload
        run: |
          set -euo pipefail

          ZIP=$(find artifacts -maxdepth 1 -name '*.zip' | head -1)
          NAME=$(basename "$ZIP")
          TAG="x00td-$(date +%Y%m%d%H%M%S)"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          SIZE=$(du -h "$ZIP" | cut -f1)
          DATE=$(date)

          {
            echo "Auto-built **ASUS Zenfone Max Pro M1 (X00TD)** kernel (${{ github.repository }}@${{ github.sha }})"
            echo
            echo "- File: $NAME"
            echo "- Size: $SIZE"
            echo "- MD5: $MD5"
            echo "- Built at: $DATE"
            echo
            echo "Flash via custom recovery (AnyKernel3)."
          } > notes.md

          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "X00TD Kernel - $NAME" \
            --notes-file notes.md

          echo "✅ Released tag: $TAG"